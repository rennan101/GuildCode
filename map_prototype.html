<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CODE LEVELER — Mapa da Ascensão</title>
    <!-- Fontes Oficiais do Projeto -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700;800;900&family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* ── Solo Leveling Core Palette ── */
            --bg-void: #000000;
            --bg-deepest: #030308;
            --bg-deep: #07070f;
            --bg-dark: #0b0b16;
            --bg-panel: #0e0e1c;
            --bg-panel-alt: #111124;
            --bg-surface: #151530;
            --bg-hover: #1a1a38;
            --bg-active: #1f1f45;

            /* ── Purple (Primary Accent — Shadow Monarch) ── */
            --purple: #7B5EA7;
            --purple-bright: #A78BFA;
            --purple-vivid: #8B5CF6;
            --purple-dim: rgba(123, 94, 167, 0.4);
            --purple-ghost: rgba(123, 94, 167, 0.12);
            --purple-glow: 0 0 15px rgba(139, 92, 246, 0.35), 0 0 40px rgba(139, 92, 246, 0.15);
            --purple-glow-strong: 0 0 15px rgba(167, 139, 250, 0.7), 0 0 35px rgba(139, 92, 246, 0.4);

            /* ── Gold & Cyan ── */
            --gold: #C9A94E;
            --gold-bright: #FBBF24;
            --gold-glow: 0 0 15px rgba(251, 191, 36, 0.6), 0 0 30px rgba(245, 158, 11, 0.4);
            --cyan: #5EEAD4;
            --cyan-dim: rgba(94, 234, 212, 0.35);
            --blue: #60A5FA;
            --green: #4ADE80;

            /* ── Borders ── */
            --border-ghost: rgba(123, 94, 167, 0.15);
            --border-dim: rgba(123, 94, 167, 0.3);
            --border-base: rgba(123, 94, 167, 0.45);
            --border-bright: rgba(167, 139, 250, 0.7);
            --border-glow: rgba(139, 92, 246, 0.9);

            /* ── Text ── */
            --text-primary: #E2E8F0;
            --text-secondary: #94A3B8;
            --text-dim: #8896AB;
            --text-ghost: #5C6B85;

            /* ── Typography ── */
            --font-display: 'Orbitron', 'Inter', sans-serif;
            --font-ui: 'Rajdhani', 'Inter', sans-serif;
            --font-code: 'Fira Code', monospace;

            --fast: 0.15s ease;
            --base: 0.25s ease;
        }

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background-color: var(--bg-void);
            color: var(--text-primary);
            font-family: var(--font-ui);
            font-size: 16px;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            letter-spacing: 0.03em;
        }

        /* ═══════════════════════════════════════════════════════════════
           TOP BAR (Header Limpo & Focado)
        ═══════════════════════════════════════════════════════════════ */
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.55rem 1.6rem;
            border-bottom: 1px solid var(--border-ghost);
            background: rgba(3, 3, 8, 0.95);
            backdrop-filter: blur(12px);
            z-index: 50;
            position: relative;
        }

        .top-bar-left {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .player-info {
            display: flex;
            align-items: center;
            gap: 0.65rem;
            cursor: pointer;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            transition: background var(--fast);
        }

        .player-info:hover {
            background: rgba(123, 94, 167, 0.12);
        }

        .player-avatar-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform var(--fast);
        }

        .player-info:hover .player-avatar-wrapper {
            transform: scale(1.08);
        }

        .player-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 2px solid var(--purple-bright);
            box-shadow: 0 0 12px rgba(139, 92, 246, 0.5);
            object-fit: cover;
        }

        .player-meta-box {
            display: flex;
            flex-direction: column;
            gap: 0.1rem;
        }

        .player-name-display {
            color: #fff;
            font-family: var(--font-display);
            font-size: 0.82rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-shadow: 0 0 8px rgba(167, 139, 250, 0.4);
        }

        .level-badge {
            font-family: var(--font-display);
            font-size: 0.58rem;
            font-weight: 700;
            padding: 0.1rem 0.4rem;
            border: 1px solid var(--border-bright);
            color: var(--purple-bright);
            letter-spacing: 0.1em;
            background: var(--purple-ghost);
            border-radius: 2px;
            width: fit-content;
        }

        /* Barra de XP Integrada no Header */
        .top-bar-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 380px;
            max-width: 40%;
        }

        .xp-bar-label-compact {
            display: flex;
            justify-content: space-between;
            width: 100%;
            font-size: 0.65rem;
            font-family: var(--font-code);
            color: var(--text-dim);
            letter-spacing: 0.1em;
            margin-bottom: 4px;
            font-weight: 700;
        }

        .xp-bar-label-compact .xp-title {
            color: var(--purple-bright);
            font-family: var(--font-display);
            font-size: 0.6rem;
            letter-spacing: 0.12em;
        }

        .xp-bar-label-compact .xp-val {
            color: var(--cyan);
        }

        .xp-bar-compact {
            width: 100%;
            height: 6px;
            background: rgba(15, 23, 42, 0.85);
            overflow: hidden;
            border: 1px solid rgba(139, 92, 246, 0.35);
            border-radius: 3px;
        }

        .xp-bar-fill-compact {
            height: 100%;
            width: 50%;
            background: linear-gradient(90deg, #7c3aed, #a855f7, #06b6d4, #22d3ee);
            box-shadow: 0 0 10px rgba(6, 182, 212, 0.6);
        }

        /* Top Bar Right: Apenas Painel e Configurações */
        .top-bar-right {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .btn-panel-header {
            background: rgba(123, 94, 167, 0.15);
            border: 1px solid var(--purple-bright);
            color: var(--text-primary);
            cursor: pointer;
            padding: 0.4rem 0.85rem;
            font-family: var(--font-display);
            font-size: 0.68rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            transition: all var(--fast);
            border-radius: 3px;
            box-shadow: 0 0 10px rgba(139, 92, 246, 0.25);
        }

        .btn-panel-header svg {
            width: 14px;
            height: 14px;
            fill: var(--purple-bright);
        }

        .btn-panel-header:hover {
            background: rgba(139, 92, 246, 0.35);
            border-color: #fff;
            color: #fff;
            box-shadow: var(--purple-glow-strong);
            transform: translateY(-1px);
        }

        .btn-settings-header {
            background: none;
            border: 1px solid var(--border-ghost);
            color: var(--text-dim);
            cursor: pointer;
            padding: 0.4rem 0.55rem;
            transition: all var(--fast);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 3px;
        }

        .btn-settings-header svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        .btn-settings-header:hover {
            border-color: var(--purple-bright);
            color: var(--purple-bright);
            background: var(--purple-ghost);
            box-shadow: 0 0 10px rgba(139, 92, 246, 0.3);
        }

        /* ═══════════════════════════════════════════════════════════════
           MAIN WORKSPACE & LAYOUT
        ═══════════════════════════════════════════════════════════════ */
        .app-body {
            display: flex;
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        /* ═══════════════════════════════════════════════════════════════
           SIDEBAR ESQUERDA: NAVEGAÇÃO RÁPIDA (Missões, Guilda, PVP, etc)
        ═══════════════════════════════════════════════════════════════ */
        .left-nav-sidebar {
            width: 72px;
            background: rgba(8, 8, 18, 0.96);
            border-right: 1px solid var(--border-ghost);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1.2rem 0;
            gap: 0.85rem;
            z-index: 40;
            backdrop-filter: blur(12px);
            flex-shrink: 0;
        }

        .nav-item-btn {
            width: 52px;
            height: 52px;
            background: rgba(20, 16, 36, 0.5);
            border: 1px solid var(--border-ghost);
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-dim);
            cursor: pointer;
            transition: all var(--fast);
            gap: 0.25rem;
        }

        .nav-item-btn svg {
            width: 19px;
            height: 19px;
            fill: currentColor;
            transition: transform var(--fast);
        }

        .nav-item-btn .nav-label {
            font-family: var(--font-display);
            font-size: 0.52rem;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        .nav-item-btn:not(.disabled):hover {
            border-color: var(--purple-bright);
            color: #fff;
            background: var(--purple-ghost);
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.35);
            transform: translateY(-2px);
        }

        .nav-item-btn:not(.disabled):hover svg {
            transform: scale(1.15);
            fill: var(--purple-bright);
        }

        .nav-item-btn.active {
            border-color: var(--purple-bright);
            color: #fff;
            background: linear-gradient(135deg, rgba(147, 51, 234, 0.3), rgba(88, 28, 135, 0.4));
            box-shadow: 0 0 15px rgba(167, 139, 250, 0.4);
        }

        .nav-item-btn.active svg {
            fill: var(--purple-bright);
        }

        /* Botão Desabilitado */
        .nav-item-btn.disabled {
            opacity: 0.42;
            cursor: not-allowed;
            filter: grayscale(0.8);
            border-color: rgba(255, 255, 255, 0.05);
        }

        .nav-item-btn.disabled:hover {
            transform: none;
            box-shadow: none;
            border-color: rgba(255, 255, 255, 0.05);
        }

        /* Viewport do Mapa — Flexível para encolher suavemente quando o drawer abre */
        .map-viewport {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: #020206;
            cursor: grab;
            transition: flex 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .map-viewport:active {
            cursor: grabbing;
        }

        /* Container do Mapa Mundial Expansível (2400x1400 px) */
        .map-pan-container {
            position: absolute;
            width: 2400px;
            height: 1400px;
            top: 0;
            left: 0;
            transform-origin: 0 0;
            will-change: transform;
            touch-action: none;
        }

        /* Imagem de Fundo em Alta Fidelidade */
        .map-bg-layer {
            position: absolute;
            inset: 0;
            background-image: url('assets/map/dark_fantasy_map_sceneries_1787958799644.jpg');
            background-size: 100% 100%;
            background-position: center;
            filter: brightness(1.1) contrast(1.1) saturate(1.25);
        }

        /* Spotlights Dedicados aos Cenários */
        .map-spotlights-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 3;
        }

        .scenery-spotlight {
            position: absolute;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle, rgba(192, 132, 252, 0.38) 0%, rgba(147, 51, 234, 0.18) 45%, rgba(56, 189, 248, 0.08) 70%, transparent 85%);
            mix-blend-mode: screen;
            filter: blur(12px);
            animation: spotPulse 4s infinite ease-in-out;
        }

        @keyframes spotPulse {
            0%, 100% { opacity: 0.85; transform: translate(-50%, -50%) scale(0.96); }
            50% { opacity: 1; transform: translate(-50%, -50%) scale(1.12); }
        }

        .map-vignette {
            position: absolute;
            inset: 0;
            box-shadow: inset 0 0 100px rgba(0, 0, 0, 0.6);
            pointer-events: none;
            z-index: 2;
        }

        /* ── HUD de Entrada com Auto-Fadeout ── */
        .map-welcome-hud {
            position: absolute;
            top: 1.5rem;
            left: 50%;
            transform: translateX(-50%);
            z-index: 30;
            pointer-events: none;
            background: rgba(8, 8, 20, 0.88);
            border: 1px solid var(--purple-bright);
            padding: 0.75rem 1.6rem;
            border-radius: 4px;
            backdrop-filter: blur(12px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.9), 0 0 20px rgba(139, 92, 246, 0.4);
            text-align: center;
            animation: welcomeFadeOut 6s forwards ease-in-out;
        }

        @keyframes welcomeFadeOut {
            0% { opacity: 0; transform: translate(-50%, -20px); }
            15% { opacity: 1; transform: translate(-50%, 0); }
            70% { opacity: 1; transform: translate(-50%, 0); }
            100% { opacity: 0; transform: translate(-50%, -10px); visibility: hidden; }
        }

        .map-welcome-title {
            font-family: var(--font-display);
            font-size: 1rem;
            font-weight: 900;
            letter-spacing: 0.18em;
            color: #fff;
            text-shadow: 0 0 15px rgba(167, 139, 250, 0.8);
        }

        .map-welcome-desc {
            font-size: 0.76rem;
            color: var(--cyan);
            margin-top: 0.25rem;
            letter-spacing: 0.05em;
        }

        /* SVG Paths Layer */
        .map-svg-layer {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            pointer-events: none;
        }

        .path-line {
            fill: none;
            stroke: rgba(192, 132, 252, 0.45);
            stroke-width: 3.5;
            stroke-dasharray: 8 6;
            stroke-linecap: round;
        }

        .path-line.active-path {
            stroke: #c084fc;
            stroke-width: 4;
            stroke-dasharray: 10 7;
            filter: drop-shadow(0 0 10px rgba(192, 132, 252, 1));
            animation: dashFlow 18s linear infinite;
        }

        @keyframes dashFlow {
            to { stroke-dashoffset: -1000; }
        }

        /* Map Nodes Layer */
        .map-nodes-container {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
        }

        .map-node {
            position: absolute;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            outline: none;
        }

        .node-icon-wrapper {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(28, 18, 52, 0.96), rgba(9, 7, 18, 0.98));
            border: 2px solid var(--border-bright);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.95), 0 0 15px rgba(167, 139, 250, 0.5);
            transition: all var(--base);
            z-index: 1;
        }

        .node-icon-wrapper::before {
            content: '';
            position: absolute;
            inset: -5px;
            border-radius: 50%;
            border: 1px dashed rgba(192, 132, 252, 0.6);
            transition: all var(--base);
        }

        /* ── Animação Pulsante para Capítulos com Missão Nova / Pendente ── */
        .map-node.pending-activities .node-icon-wrapper {
            border-color: var(--gold-bright);
            animation: nodeGoldPulseGlow 1.8s infinite ease-in-out;
        }

        .map-node.pending-activities .node-icon-wrapper::before {
            border: 2px solid rgba(251, 191, 36, 0.9);
            animation: nodeGoldPulseRing 1.8s infinite ease-out;
        }

        @keyframes nodeGoldPulseGlow {
            0%, 100% {
                transform: scale(1);
                box-shadow: 0 0 15px rgba(251, 191, 36, 0.7), 0 0 35px rgba(245, 158, 11, 0.4);
            }
            50% {
                transform: scale(1.14);
                box-shadow: 0 0 28px rgba(251, 191, 36, 1), 0 0 55px rgba(245, 158, 11, 0.85);
                border-color: #fff;
            }
        }

        @keyframes nodeGoldPulseRing {
            0% {
                inset: -4px;
                opacity: 1;
                transform: scale(1);
            }
            100% {
                inset: -14px;
                opacity: 0;
                transform: scale(1.3);
            }
        }

        .map-node:hover .node-icon-wrapper {
            transform: scale(1.2);
            border-color: #fff;
            box-shadow: 0 0 30px rgba(192, 132, 252, 1), 0 0 50px rgba(147, 51, 234, 0.9);
        }

        /* Nó Selecionado */
        .map-node.selected .node-icon-wrapper {
            border-color: #fff;
            background: linear-gradient(135deg, #9333ea, #581c87);
            box-shadow: 0 0 30px rgba(192, 132, 252, 1), 0 0 60px rgba(147, 51, 234, 0.8);
            transform: scale(1.22);
        }

        /* Nó Concluído */
        .map-node.completed .node-icon-wrapper {
            border-color: var(--green);
            box-shadow: 0 0 15px rgba(74, 222, 128, 0.6);
        }

        .map-node.locked {
            filter: grayscale(0.85) opacity(0.6);
        }

        .map-node.locked:hover {
            filter: grayscale(0.2) opacity(0.95);
        }

        /* Símbolos Internos */
        .node-symbol-inner {
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }

        /* '!' Amarelo para Missão Nova */
        .node-symbol-inner.symbol-new {
            font-family: var(--font-display);
            font-size: 1.4rem;
            font-weight: 900;
            color: var(--gold-bright);
            text-shadow: var(--gold-glow);
        }

        /* Check SVG Verde para Concluído */
        .node-symbol-inner.symbol-check svg {
            width: 22px;
            height: 22px;
            fill: var(--green);
            filter: drop-shadow(0 0 6px rgba(74, 222, 128, 0.8));
        }

        /* Cadeado SVG para Bloqueado */
        .node-symbol-inner.symbol-lock svg {
            width: 20px;
            height: 20px;
            fill: #94a3b8;
        }

        .map-node.selected .node-symbol-inner svg {
            fill: #fff;
        }

        /* ── Hover-Only Info Tag ── */
        .node-info-tag {
            position: absolute;
            top: 58px;
            background: rgba(10, 8, 24, 0.97);
            border: 1.5px solid var(--purple-bright);
            border-radius: 6px;
            padding: 8px 14px;
            text-align: center;
            backdrop-filter: blur(12px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.95), 0 0 20px rgba(139, 92, 246, 0.5);
            white-space: nowrap;
            opacity: 0;
            visibility: hidden;
            transform: translateY(8px);
            transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
            z-index: 25;
        }

        .map-node:hover .node-info-tag {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .node-id-prefix {
            font-size: 0.68rem;
            font-family: var(--font-code);
            color: var(--purple-bright);
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .node-title {
            font-family: var(--font-display);
            font-size: 0.92rem;
            font-weight: 800;
            color: #fff;
            letter-spacing: 0.06em;
            margin: 2px 0;
        }

        .node-subtitle {
            font-size: 0.75rem;
            color: var(--cyan);
            font-weight: 600;
        }

        /* ═══════════════════════════════════════════════════════════════
           DRAWER DIREITO: PAINEL DEDICADO LADO A LADO (NÃO COBRE O MAPA)
        ═══════════════════════════════════════════════════════════════ */
        .chapter-drawer-right {
            width: 0;
            opacity: 0;
            background: linear-gradient(180deg, rgba(14, 14, 28, 0.98) 0%, rgba(7, 7, 15, 0.99) 100%);
            border-left: 0px solid var(--border-bright);
            display: flex;
            flex-direction: column;
            padding: 0;
            overflow-y: auto;
            overflow-x: hidden;
            z-index: 45;
            backdrop-filter: blur(18px);
            box-shadow: none;
            transition: width 0.35s cubic-bezier(0.16, 1, 0.3, 1), padding 0.35s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.25s ease;
            position: relative;
            flex-shrink: 0;
        }

        .chapter-drawer-right.open {
            width: 390px;
            padding: 1.3rem;
            opacity: 1;
            border-left: 1px solid var(--border-bright);
            box-shadow: -10px 0 35px rgba(0, 0, 0, 0.8);
        }

        .drawer-close-btn {
            position: absolute;
            top: 1rem;
            left: 1rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-ghost);
            color: var(--text-dim);
            width: 30px;
            height: 30px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all var(--fast);
            z-index: 10;
        }

        .drawer-close-btn:hover {
            border-color: var(--purple-bright);
            color: #fff;
            background: var(--purple-ghost);
            box-shadow: 0 0 10px rgba(139, 92, 246, 0.4);
        }

        .drawer-close-btn svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        .drawer-header {
            text-align: center;
            position: relative;
            padding-bottom: 0.8rem;
            margin-bottom: 1rem;
            border-bottom: 1px solid var(--border-dim);
            padding-left: 1.5rem;
        }

        .drawer-header::after {
            content: '◈';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.65rem;
            color: var(--purple-bright);
            background: #0e0e1c;
            padding: 0 6px;
        }

        .chapter-number-tag {
            font-size: 0.65rem;
            font-family: var(--font-display);
            letter-spacing: 0.22em;
            color: var(--purple-bright);
            font-weight: 700;
            text-transform: uppercase;
        }

        .chapter-main-title {
            font-family: var(--font-display);
            font-size: 1.2rem;
            font-weight: 900;
            color: var(--text-primary);
            margin-top: 0.25rem;
            letter-spacing: 0.08em;
            text-shadow: 0 0 12px rgba(167, 139, 250, 0.3);
        }

        .chapter-theme-sub {
            font-size: 0.75rem;
            color: var(--cyan);
            margin-top: 0.2rem;
            font-weight: 600;
        }

        .chapter-image-banner {
            width: 100%;
            height: 160px;
            border-radius: 4px;
            border: 1px solid var(--border-base);
            overflow: hidden;
            position: relative;
            margin-bottom: 1.1rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.7);
        }

        .chapter-image-banner img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .chapter-image-banner:hover img {
            transform: scale(1.05);
        }

        .chapter-image-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, transparent 40%, rgba(7, 7, 15, 0.92) 100%);
            pointer-events: none;
        }

        .chapter-character-badge {
            position: absolute;
            bottom: 8px;
            left: 8px;
            background: rgba(11, 11, 22, 0.9);
            border: 1px solid var(--purple-bright);
            padding: 0.25rem 0.6rem;
            border-radius: 2px;
            font-size: 0.62rem;
            font-family: var(--font-display);
            color: var(--purple-bright);
            display: flex;
            align-items: center;
            gap: 0.4rem;
            backdrop-filter: blur(4px);
        }

        .chapter-character-badge svg {
            width: 12px;
            height: 12px;
            fill: currentColor;
        }

        .drawer-section-title {
            font-family: var(--font-display);
            font-size: 0.68rem;
            letter-spacing: 0.16em;
            color: var(--text-dim);
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 0.45rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .drawer-section-title::before {
            content: '';
            width: 3px;
            height: 10px;
            background: var(--purple-bright);
            box-shadow: 0 0 6px var(--purple-bright);
        }

        .chapter-story-text {
            font-size: 0.82rem;
            color: var(--text-primary);
            line-height: 1.45;
            margin-bottom: 1.1rem;
            background: rgba(21, 21, 48, 0.5);
            border-left: 2px solid var(--purple);
            padding: 0.65rem 0.85rem;
            border-radius: 0 3px 3px 0;
        }

        .systems-list {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
            margin-bottom: 1.1rem;
        }

        .system-item-chip {
            display: flex;
            align-items: flex-start;
            gap: 0.45rem;
            font-size: 0.78rem;
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-ghost);
            padding: 0.45rem 0.65rem;
            border-radius: 3px;
        }

        .system-item-chip svg {
            width: 13px;
            height: 13px;
            fill: var(--purple-bright);
            margin-top: 2px;
            flex-shrink: 0;
        }

        .progress-box {
            margin-bottom: 1.1rem;
            background: rgba(17, 17, 36, 0.6);
            border: 1px solid var(--border-dim);
            padding: 0.65rem 0.8rem;
            border-radius: 3px;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.65rem;
            color: var(--text-dim);
            margin-bottom: 0.35rem;
            font-family: var(--font-code);
        }

        .progress-bar-bg {
            height: 6px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 2px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .progress-bar-fill-drawer {
            height: 100%;
            background: linear-gradient(90deg, var(--purple-vivid), var(--cyan));
            box-shadow: 0 0 8px rgba(94, 234, 212, 0.4);
            transition: width 0.4s ease;
        }

        .rewards-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.5rem;
            margin-bottom: 1.3rem;
        }

        .reward-card {
            background: rgba(21, 21, 48, 0.6);
            border: 1px solid var(--border-ghost);
            border-radius: 3px;
            padding: 0.55rem 0.3rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 0.2rem;
            transition: all var(--fast);
        }

        .reward-card:hover {
            border-color: var(--purple-bright);
            background: rgba(27, 27, 60, 0.8);
            transform: translateY(-2px);
        }

        .reward-icon-svg {
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .reward-icon-svg svg {
            width: 16px;
            height: 16px;
            fill: var(--purple-bright);
        }

        .reward-amount {
            font-size: 0.75rem;
            font-weight: 700;
            font-family: var(--font-code);
            color: #fff;
        }

        .reward-label {
            font-size: 0.58rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .btn-start-chapter {
            margin-top: auto;
            width: 100%;
            padding: 0.8rem 1rem;
            background: rgba(139, 92, 246, 0.15);
            border: 1px solid var(--purple-bright);
            border-radius: 3px;
            color: #fff;
            font-family: var(--font-display);
            font-size: 0.82rem;
            font-weight: 700;
            letter-spacing: 0.18em;
            cursor: pointer;
            box-shadow: var(--purple-glow);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            transition: all var(--base);
            text-transform: uppercase;
        }

        .btn-start-chapter svg {
            width: 14px;
            height: 14px;
            fill: currentColor;
        }

        .btn-start-chapter:hover {
            background: rgba(139, 92, 246, 0.32);
            border-color: #fff;
            box-shadow: var(--purple-glow-strong);
            transform: translateY(-2px);
        }

        .btn-start-chapter.locked-btn {
            background: rgba(18, 18, 30, 0.5);
            border-color: var(--border-ghost);
            color: var(--text-ghost);
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        /* ═══════════════════════════════════════════════════════════════
           FOOTER STATUS BAR
        ═══════════════════════════════════════════════════════════════ */
        .footer-status-bar {
            height: 36px;
            background: #030308;
            border-top: 1px solid var(--border-ghost);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1.6rem;
            font-size: 0.68rem;
            color: var(--text-dim);
            z-index: 50;
        }

        .footer-left {
            display: flex;
            align-items: center;
            gap: 1.4rem;
            font-family: var(--font-display);
            font-size: 0.62rem;
            letter-spacing: 0.08em;
        }

        .status-badge-item {
            display: flex;
            align-items: center;
            gap: 0.35rem;
        }

        .status-badge-item .val {
            color: var(--purple-bright);
            font-weight: 700;
        }

        .footer-right {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .btn-terminal-quick {
            display: flex;
            align-items: center;
            gap: 0.35rem;
            background: rgba(14, 14, 28, 0.8);
            border: 1px solid var(--border-dim);
            padding: 0.25rem 0.65rem;
            border-radius: 2px;
            color: var(--purple-bright);
            font-family: var(--font-code);
            font-size: 0.62rem;
            cursor: pointer;
            transition: all var(--fast);
        }

        .btn-terminal-quick:hover {
            border-color: var(--purple-bright);
            color: #fff;
            box-shadow: 0 0 10px rgba(139, 92, 246, 0.3);
        }

        /* Toast Feedback */
        .system-toast {
            position: fixed;
            bottom: 50px;
            right: 430px;
            background: rgba(11, 11, 24, 0.96);
            border: 1px solid var(--purple-bright);
            box-shadow: var(--purple-glow-strong);
            color: #fff;
            padding: 0.65rem 1.1rem;
            border-radius: 4px;
            font-size: 0.78rem;
            font-family: var(--font-display);
            letter-spacing: 0.05em;
            display: flex;
            align-items: center;
            gap: 0.55rem;
            transform: translateY(60px);
            opacity: 0;
            pointer-events: none;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .system-toast.show {
            transform: translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body>

    <!-- ═══════════════════════════════════════════════════════════════
         TOP BAR: Perfil, Barra de XP, Painel e Configurações
    ═══════════════════════════════════════════════════════════════ -->
    <header class="top-bar">
        <!-- Esquerda: Perfil + Nome + Level -->
        <div class="top-bar-left">
            <div class="player-info" onclick="showToast('Abrindo Perfil do Jogador...')" title="Ver Perfil">
                <div class="player-avatar-wrapper">
                    <img class="player-avatar" src="assets/avatars/avatar_02.png" alt="Avatar">
                </div>
                <div class="player-meta-box">
                    <span class="player-name-display">COMBOGO</span>
                    <span class="level-badge">LV. 01</span>
                </div>
            </div>
        </div>

        <!-- Centro: Barra de XP -->
        <div class="top-bar-center">
            <div class="xp-bar-label-compact">
                <span class="xp-title">EXP ASCENSÃO</span>
                <span class="xp-val">150 / 300 XP</span>
            </div>
            <div class="xp-bar-compact">
                <div class="xp-bar-fill-compact"></div>
            </div>
        </div>

        <!-- Direita: Painel (Professor/Adm) + Configurações -->
        <div class="top-bar-right">
            <button class="btn-panel-header" onclick="showToast('Acessando Painel de Controle (Professor)...')">
                <svg viewBox="0 0 24 24"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg>
                <span>PAINEL</span>
            </button>
            <button class="btn-settings-header" title="Configurações" onclick="showToast('Abrindo Configurações...')">
                <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
            </button>
        </div>
    </header>

    <!-- ═══════════════════════════════════════════════════════════════
         MAIN WORKSPACE: Sidebar Esquerda + Mapa com Arraste + Drawer Direito
    ═══════════════════════════════════════════════════════════════ -->
    <div class="app-body">
        
        <!-- Sidebar Lateral Esquerda: Acesso Rápido -->
        <nav class="left-nav-sidebar">
            <button class="nav-item-btn active" title="Missões (Mapa)" onclick="showToast('Você já está no Mapa de Missões!')">
                <svg viewBox="0 0 24 24"><path d="M20.5 3l-.16.03L15 5.1 9 3 3.36 4.9c-.21.07-.36.25-.36.48V20.5c0 .28.22.5.5.5l.16-.03L9 18.9l6 2.1 5.64-1.9c.21-.07.36-.25.36-.48V3.5c0-.28-.22-.5-.5-.5zM15 19l-6-2.11V5l6 2.11V19z"/></svg>
                <span class="nav-label">MISSÕES</span>
            </button>
            <button class="nav-item-btn" title="Guilda" onclick="showToast('Acessando Sede da Guilda...')">
                <!-- Ícone de Casa para Guilda -->
                <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                <span class="nav-label">GUILDA</span>
            </button>
            <button class="nav-item-btn" title="PVP" onclick="showToast('Entrando na Arena PVP...')">
                <!-- Ícone Real e Equilibrado de Espadas Cruzadas em X para PVP -->
                <svg viewBox="0 0 24 24"><path d="M19.7 2.3a1 1 0 0 0-1.4 0l-4.9 4.9-1.4-1.4a1 1 0 0 0-1.4 0l-1.4 1.4a1 1 0 0 0 0 1.4l1.4 1.4-6.6 6.6-1.6-.5-.8.8 2.3 2.3-3.2 3.2 1.4 1.4 3.2-3.2 2.3 2.3.8-.8-.5-1.6 6.6-6.6 1.4 1.4a1 1 0 0 0 1.4 0l1.4-1.4a1 1 0 0 0 0-1.4l-1.4-1.4 4.9-4.9a1 1 0 0 0 0-1.4l-1.6-1.6zm-8.4 9.8l-1.4-1.4 3.5-3.5 1.4 1.4-3.5 3.5zM4.3 2.3a1 1 0 0 0-1.4 0l-1.6 1.6a1 1 0 0 0 0 1.4l4.9 4.9-1.4 1.4a1 1 0 0 0 0 1.4l1.4 1.4a1 1 0 0 0 1.4 0l1.4-1.4 6.6 6.6-.5 1.6.8.8 2.3-2.3 3.2 3.2 1.4-1.4-3.2-3.2 2.3-2.3-.8-.8-1.6.5-6.6-6.6 1.4-1.4a1 1 0 0 0 0-1.4l-1.4-1.4a1 1 0 0 0-1.4 0l-1.4 1.4-4.9-4.9zm5.6 5.6l1.4 1.4-3.5 3.5-1.4-1.4 3.5-3.5z"/></svg>
                <span class="nav-label">PVP</span>
            </button>
            <button class="nav-item-btn" title="Torneio" onclick="showToast('Acessando Grande Torneio...')">
                <svg viewBox="0 0 24 24"><path d="M19 5h-2V3H7v2H5c-1.1 0-2 .9-2 2v1c0 2.55 1.92 4.63 4.39 4.94A5.01 5.01 0 0 0 11 15.9V19H7v2h10v-2h-4v-3.1a5.01 5.01 0 0 0 3.61-2.96C19.08 12.63 21 10.55 21 8V7c0-1.1-.9-2-2-2zM5 8V7h2v3.82C5.84 10.4 5 9.3 5 8zm14 0c0 1.3-.84 2.4-2 2.82V7h2v1z"/></svg>
                <span class="nav-label">TORNEIO</span>
            </button>
            <!-- Botão da Party Desabilitado -->
            <button class="nav-item-btn disabled" title="Party (Em breve)" onclick="showToast('[ SISTEMA ] O recurso de Party será liberado em breve!')">
                <svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
                <span class="nav-label">PARTY</span>
            </button>
        </nav>

        <!-- Interactive Map Viewport (Encolhe em layout flex ao abrir o drawer, sem sobreposição) -->
        <main class="map-viewport" id="map-viewport">
            
            <!-- Container Arrasto/Pan Fixo (2400x1400 px, com zoom out ampliado) -->
            <div class="map-pan-container" id="map-pan-container">
                <div class="map-bg-layer"></div>
                
                <!-- Spotlights Dedicados aos Cenários -->
                <div class="map-spotlights-layer" id="spotlights-container"></div>

                <div class="map-vignette"></div>

                <!-- SVG Connecting Lines -->
                <svg class="map-svg-layer" id="map-svg-layer" width="2400" height="1400" viewBox="0 0 2400 1400"></svg>

                <!-- Map Location Nodes -->
                <div class="map-nodes-container" id="nodes-container"></div>
            </div>

            <!-- HUD de Entrada (Aparece ao entrar e desaparece com fadeout suave) -->
            <div class="map-welcome-hud" id="map-welcome-hud">
                <div class="map-welcome-title">[ MAPA DA ASCENSÃO ]</div>
                <div class="map-welcome-desc">Clique e arraste com o mouse para explorar os 16 Capítulos da Guilda.</div>
            </div>
        </main>

        <!-- Drawer Lateral Direito: Informações do Capítulo (Fica lado a lado com o mapa) -->
        <aside class="chapter-drawer-right" id="chapter-drawer-right">
            <button class="drawer-close-btn" onclick="closeDrawer()" title="Fechar Painel">
                <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
            </button>
            <div id="drawer-content-body">
                <!-- Rendered dynamically -->
            </div>
        </aside>
    </div>

    <!-- ═══════════════════════════════════════════════════════════════
         FOOTER STATUS BAR
    ═══════════════════════════════════════════════════════════════ -->
    <footer class="footer-status-bar">
        <div class="footer-left">
            <div class="status-badge-item">
                <span>RANK:</span>
                <span class="val">NOVATO</span>
            </div>
            <div class="status-badge-item">
                <span>GUILD POWER:</span>
                <span class="val">150 GP</span>
            </div>
        </div>

        <div class="footer-right">
            <button class="btn-terminal-quick" onclick="showToast('Inicializando Terminal da Guilda...')">
                <span>[>]</span> TERMINAL DA GUILDA
            </button>
        </div>
    </footer>

    <!-- Toast Notification -->
    <div class="system-toast" id="system-toast">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M12 2L2 7l10 5 10-5-10-5zm0 8.5L4.5 7.1 12 3.3l7.5 3.8L12 10.5zm0 3.5l-10-5v6l10 5 10-5v-6l-10 5z"/></svg>
        <span id="toast-message">Notificação</span>
    </div>

    <!-- ═══════════════════════════════════════════════════════════════
         DATA & SCRIPT LOGIC
    ═══════════════════════════════════════════════════════════════ -->
    <script>

        // ═══════════════════════════════════════════════════════════════
        // ENGINE DE ARRASTO (ZOOM OUT AMPLO E ESCALA AJUSTADA)
        // ═══════════════════════════════════════════════════════════════
        const MAP_WIDTH = 2400;
        const MAP_HEIGHT = 1400;

        const panState = {
            x: -200,
            y: -50,
            scale: 0.65,
            isDragging: false,
            startX: 0,
            startY: 0
        };

        const viewport = document.getElementById('map-viewport');
        const panContainer = document.getElementById('map-pan-container');

        // Calcula a escala ideal para visualização mais ampla (Zoom out confortável)
        function calculateIdealScale() {
            const vw = viewport.clientWidth;
            const vh = viewport.clientHeight;
            // Garante que o mapa se expanda bem e caiba no mínimo 100% da tela sem bordas pretas
            return Math.max(vw / MAP_WIDTH, vh / MAP_HEIGHT, 0.62);
        }

        // Trava os limites do arrasto
        function clampPanCoordinates(x, y, scale) {
            const vw = viewport.clientWidth;
            const vh = viewport.clientHeight;
            
            const scaledWidth = MAP_WIDTH * scale;
            const scaledHeight = MAP_HEIGHT * scale;

            let minX = vw - scaledWidth;
            let maxX = 0;
            if (scaledWidth < vw) {
                x = (vw - scaledWidth) / 2;
            } else {
                x = Math.min(maxX, Math.max(minX, x));
            }

            let minY = vh - scaledHeight;
            let maxY = 0;
            if (scaledHeight < vh) {
                y = (vh - scaledHeight) / 2;
            } else {
                y = Math.min(maxY, Math.max(minY, y));
            }

            return { x, y };
        }

        function updatePanTransform() {
            panState.scale = calculateIdealScale();
            const clamped = clampPanCoordinates(panState.x, panState.y, panState.scale);
            panState.x = clamped.x;
            panState.y = clamped.y;

            panContainer.style.transform = `translate(${panState.x}px, ${panState.y}px) scale(${panState.scale})`;
        }

        // Centraliza a câmera no nó selecionado
        function centerOnNode(chap) {
            if (!chap) return;
            const vw = viewport.clientWidth;
            const vh = viewport.clientHeight;
            panState.x = vw / 2 - chap.x * panState.scale;
            panState.y = vh / 2 - chap.y * panState.scale;
            updatePanTransform();
        }

        // Eventos de Mouse Drag (Arrastar)
        viewport.addEventListener('mousedown', (e) => {
            if (e.target.closest('.map-node')) return;
            panState.isDragging = true;
            panState.startX = e.clientX - panState.x;
            panState.startY = e.clientY - panState.y;
        });

        window.addEventListener('mousemove', (e) => {
            if (!panState.isDragging) return;
            panState.x = e.clientX - panState.startX;
            panState.y = e.clientY - panState.startY;
            updatePanTransform();
        });

        window.addEventListener('mouseup', () => {
            panState.isDragging = false;
        });

        // Resize da tela
        window.addEventListener('resize', () => {
            updatePanTransform();
        });

        // ═══════════════════════════════════════════════════════════════
        // RENDER SVG CONNECTIONS & NODES
        // ═══════════════════════════════════════════════════════════════
        function renderConnections() {
            const svgLayer = document.getElementById('map-svg-layer');
            svgLayer.innerHTML = '';

            MAP_CONNECTIONS.forEach(conn => {
                const nodeA = ALL_CHAPTERS.find(c => c.id === conn.from);
                const nodeB = ALL_CHAPTERS.find(c => c.id === conn.to);
                if (!nodeA || !nodeB) return;

                const midX = (nodeA.x + nodeB.x) / 2;
                const midY = (nodeA.y + nodeB.y) / 2 + (nodeA.x < nodeB.x ? 30 : -30);

                const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                path.setAttribute('d', `M ${nodeA.x} ${nodeA.y} Q ${midX} ${midY}, ${nodeB.x} ${nodeB.y}`);
                path.setAttribute('class', `path-line ${conn.active ? 'active-path' : ''}`);
                svgLayer.appendChild(path);
            });
        }

        function renderSpotlightsAndNodes() {
            const spotlightsContainer = document.getElementById('spotlights-container');
            const nodesContainer = document.getElementById('nodes-container');
            
            spotlightsContainer.innerHTML = '';
            nodesContainer.innerHTML = '';

            ALL_CHAPTERS.forEach(chap => {
                // Spotlight atrás da construção
                const spot = document.createElement('div');
                spot.className = 'scenery-spotlight';
                spot.style.left = `${chap.x}px`;
                spot.style.top = `${chap.y - 70}px`;
                spot.style.width = '240px';
                spot.style.height = '240px';
                spotlightsContainer.appendChild(spot);

                // Verifica se é um capítulo desbloqueado com missões a fazer
                const hasPending = chap.status === 'unlocked' && chap.missionsDone < chap.missionsCount;

                // Símbolo do Nó:
                // 1) Concluído: Ícone de Check verde
                // 2) Bloqueado: Cadeado SVG
                // 3) Desbloqueado / Nova Missão: '!' Amarelo em destaque
                let symbolHTML = `<span class="node-symbol-inner symbol-new">!</span>`;
                if (chap.status === 'completed') {
                    symbolHTML = `<div class="node-symbol-inner symbol-check">${SVGS.check}</div>`;
                } else if (chap.status === 'locked') {
                    symbolHTML = `<div class="node-symbol-inner symbol-lock">${SVGS.lock}</div>`;
                }

                const node = document.createElement('div');
                node.className = `map-node ${chap.status} ${chap.id === currentSelectedId ? 'selected' : ''} ${hasPending ? 'pending-activities' : ''}`;
                node.style.left = `${chap.x}px`;
                node.style.top = `${chap.y}px`;
                node.setAttribute('tabindex', '0');

                node.innerHTML = `
                    <div class="node-icon-wrapper">
                        ${symbolHTML}
                    </div>
                    <!-- Tooltip flutuante expandida no hover -->
                    <div class="node-info-tag">
                        <div class="node-id-prefix">${chap.numStr}</div>
                        <div class="node-title">${chap.title}</div>
                        <div class="node-subtitle">${chap.theme}</div>
                    </div>
                `;

                node.addEventListener('click', (e) => {
                    e.stopPropagation();
                    selectChapter(chap.id);
                });

                nodesContainer.appendChild(node);
            });
        }

        // Seleciona e abre o Drawer Direito (Sem sobrepor o mapa)
        function selectChapter(id) {
            currentSelectedId = id;
            renderSpotlightsAndNodes();
            renderDrawer();
            openDrawer();
            
            // Suavemente centraliza o mapa no capítulo aberto
            setTimeout(() => {
                const chap = ALL_CHAPTERS.find(c => c.id === id);
                centerOnNode(chap);
            }, 50);
        }

        function openDrawer() {
            document.getElementById('chapter-drawer-right').classList.add('open');
            setTimeout(updatePanTransform, 360);
        }

        function closeDrawer() {
            document.getElementById('chapter-drawer-right').classList.remove('open');
            currentSelectedId = null;
            renderSpotlightsAndNodes();
            setTimeout(updatePanTransform, 360);
        }

        // Render Drawer Content
        function renderDrawer() {
            const chap = ALL_CHAPTERS.find(c => c.id === currentSelectedId);
            if (!chap) return;

            const drawerBody = document.getElementById('drawer-content-body');
            const progressPercent = Math.round((chap.missionsDone / chap.missionsCount) * 100);

            let buttonActionText = "INICIAR CAPÍTULO";
            let buttonClass = "btn-start-chapter";
            let buttonIcon = SVGS.play;

            if (chap.status === 'locked') {
                buttonActionText = "CAPÍTULO BLOQUEADO";
                buttonClass = "btn-start-chapter locked-btn";
                buttonIcon = SVGS.lock;
            } else if (chap.status === 'completed') {
                buttonActionText = "REVISAR CAPÍTULO";
            }

            drawerBody.innerHTML = `
                <div class="drawer-header">
                    <div class="chapter-number-tag">${chap.numStr}</div>
                    <div class="chapter-main-title">${chap.title}</div>
                    <div class="chapter-theme-sub">${chap.theme}</div>
                </div>

                <div class="chapter-image-banner">
                    <img src="${chap.image}" alt="${chap.title}">
                    <div class="chapter-image-overlay"></div>
                    <div class="chapter-character-badge">
                        ${SVGS.user}
                        <span>${chap.character}</span>
                    </div>
                </div>

                <div class="drawer-section-title">DESAFIO</div>
                <div class="chapter-story-text">
                    ${chap.narrative}
                    <br><br>
                    <span style="color: var(--purple-bright); font-weight: 600;">${chap.summary}</span>
                </div>

                <div class="drawer-section-title">Sistemas Abordados</div>
                <div class="systems-list">
                    ${chap.systems.map(s => `
                        <div class="system-item-chip">
                            ${SVGS.magic}
                            <span>${s}</span>
                        </div>
                    `).join('')}
                </div>

                <div class="drawer-section-title">Progresso das Missões</div>
                <div class="progress-box">
                    <div class="progress-header">
                        <span>MISSÕES CONCLUÍDAS</span>
                        <span style="color: var(--cyan);">${chap.missionsDone} / ${chap.missionsCount} (${progressPercent}%)</span>
                    </div>
                    <div class="progress-bar-bg">
                        <div class="progress-bar-fill-drawer" style="width: ${progressPercent}%;"></div>
                    </div>
                </div>

                <div class="drawer-section-title">Recompensas</div>
                <div class="rewards-grid">
                    <div class="reward-card">
                        <div class="reward-icon-svg">${SVGS.bolt}</div>
                        <div class="reward-amount">+${chap.rewards.xp} XP</div>
                        <div class="reward-label">Experiência</div>
                    </div>
                    <div class="reward-card">
                        <div class="reward-icon-svg">${SVGS.gem}</div>
                        <div class="reward-amount">+${chap.rewards.gp} GP</div>
                        <div class="reward-label">Guild Points</div>
                    </div>
                    <div class="reward-card">
                        <div class="reward-icon-svg">${SVGS.chest}</div>
                        <div class="reward-amount" style="font-size: 0.62rem;">${chap.rewards.item}</div>
                        <div class="reward-label">Recompensa</div>
                    </div>
                </div>

                <button class="${buttonClass}" onclick="handleChapterClick(${chap.id})">
                    ${buttonIcon}
                    <span>${buttonActionText}</span>
                </button>
            `;
        }

        function handleChapterClick(id) {
            const chap = ALL_CHAPTERS.find(c => c.id === id);
            if (chap.status === 'locked') {
                showToast(`[ SISTEMA ] O ${chap.numStr} ainda está selado.`);
            } else {
                showToast(`[ SISTEMA ] Inicializando ${chap.numStr}: ${chap.title}...`);
            }
        }

        function showToast(text) {
            const toast = document.getElementById('system-toast');
            const msg = document.getElementById('toast-message');
            msg.innerText = text;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // Inicialização
        renderConnections();
        renderSpotlightsAndNodes();
        updatePanTransform();
    </script>
</body>
</html>
